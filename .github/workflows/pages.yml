name: Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler: "4.0.16"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build, validate, and audit dependencies
        env:
          BUNDLE_FROZEN: "true"
          JEKYLL_ENV: production
          ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
        run: npm run site:verify

      - name: Verify generated browser bundle is committed
        run: git diff --exit-code -- assets/js/main.min.js

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Validate deployment files
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/assets/css/main.css
          test -s _site/algolia-records.json
          test "$(tr -d '\r\n' < _site/CNAME)" = "www.ewaya.com"

      - name: Upload Algolia records
        uses: actions/upload-artifact@v7
        with:
          name: algolia-records
          path: _site/algolia-records.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

  algolia:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    env:
      ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY || secrets.ALGOLIA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Algolia dependencies
        run: npm ci --omit=dev

      - name: Download Algolia records
        uses: actions/download-artifact@v8
        with:
          name: algolia-records
          path: _site

      - name: Push Algolia records
        id: algolia-push
        if: env.ALGOLIA_ADMIN_API_KEY != ''
        continue-on-error: true
        run: npm run algolia:push

      - name: Report Algolia fallback
        if: steps.algolia-push.outcome == 'failure'
        run: echo '::warning::Algolia push failed; deployed search will use algolia-records.json as its local fallback.'
