  bio              : "依心依道本自若，不忧不惧自从容"
#  location         : ""
  email            : "malangwtgh@hotmail.com"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      # url: "malangwtgh@hotmail.com"
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://www.ewaya.com"
    - label: "X"
      icon: "fab fa-fw fa-square-x-twitter"
      # url: "https://x.com/"
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook-square"
      url: "https://www.facebook.com/profile.php?id=100088693703792"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/GabrielPeace/Peaceedu"
    - label: "Youtube"
