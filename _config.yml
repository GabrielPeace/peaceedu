# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Theme Settings
#
# Review documentation to determine if you should use `theme` or `remote_theme`
# https://mmistakes.github.io/minimal-mistakes/docs/quick-start-guide/#installing-the-theme

# theme                  : "minimal-mistakes-jekyll"
# remote_theme           : "mmistakes/minimal-mistakes"
minimal_mistakes_skin    : "mint" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site Settings
locale                   : "zh-CN"
rtl                      : # true, false (default) # turns direction of the page into right to left for RTL languages
title                    : "小马哥的从容教育"
title_separator          : "|"
subtitle                 : "让父母从容，让孩子自若" # site tagline that appears below site title in masthead
name                     : &name "Gabriel"
description              : &description "面向父母的家庭教育文章、沟通方法与成长支持，让父母更从容，让孩子更自若。"
url                      : "https://www.ewaya.com" # the base hostname & protocol for your site e.g. "https://kewtgh.github.io"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "GabrielPeace/peaceedu" # GitHub username/repo-name e.g. "mmistakes/minimal-mistakes"
teaser                   : "/assets/img/bio-photo-500x300.png" # path of fallback teaser image, e.g. "/assets/images/500x300.png"
logo                     : "/assets/img/logo-peaceedu.png" # path of logo image to display in the masthead, e.g. "/assets/images/88x88.png"
masthead_title           : "小马哥的从容教育" # overrides the website title displayed in the masthead, use " " for no title
breadcrumbs              : false # true, false (default)
words_per_minute         : 350
chinese_words_per_minute         : 350
enable_copy_code_button  : true # true, false (default)
github                   : [metadata]
comments:
  provider               : "disqus" # false (default), "disqus", "discourse", "facebook", "staticman", "staticman_v2", "utterances", "giscus", "custom"

  disqus:
    shortname            : "peace-edu" # https://help.disqus.com/customer/portal/articles/466208-what-s-a-shortname-

  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org

  facebook:
    # https://developers.facebook.com/docs/plugins/comments
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : "light" # "light" (default), "dark"
  utterances:
    theme                : # "github-light" (default), "github-dark"
    issue_term           : # "pathname" (default)
  giscus:
    repo_id              : # Shown during giscus setup at https://giscus.app
    category_name        : # Full text name of the category
    category_id          : # Shown during giscus setup at https://giscus.app
    discussion_term      : # "pathname" (default), "url", "title", "og:title"
    reactions_enabled    : # '1' for enabled (default), '0' for disabled
    theme                : # "light" (default), "dark", "dark_dimmed", "transparent_dark", "preferred_color_scheme"
  staticman:
    branch               : main # "main"
    endpoint             : # "https://{your Staticman v3 API}/v3/entry/github/"
reCaptcha:
  siteKey                :
  secret                 :

atom_feed:
  path                   : # blank (default) uses feed.xml
  hide                   : # true, false (default)

search                   : true # true, false (default)
search_full_content      : false # true, false (default)
search_provider          : "algolia" # lunr (default), algolia
algolia:
  files_to_exclude:
    - index.html
    - index.md
    - /docs/_drafts/*.md
    - _documents/*.md
    - /assets/*.*
    - _pages/*.md
    - _pages/*.html
    - _posts/2017-11-28-post-exclude-search.md
  application_id         : HT0DEXOKEY # YOUR_APPLICATION_ID
  index_name             : PeaceEdu # YOUR_INDEX_NAME
  # search_only_api_key    : # YOUR_SEARCH_ONLY_API_KEY
  minimum_query_length   : 2
  query_debounce_ms      : 450
  hits_per_page          : 20
  powered_by             : true # true (default), false

# SEO Related
google_site_verification : "" # Replace this with your ID, or delete
bing_site_verification   :
naver_site_verification  :
yandex_site_verification :
baidu_site_verification  :

# Social Sharing
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : # Open Graph/Twitter default site image
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles

# Analytics
analytics:
  provider               : "google-gtag" # false (default), "google", "google-universal", "google-gtag", "custom"
  google:
    tracking_id          : G-MJ269XLLJ0
    anonymize_ip         : false # true, false (default)

# AI assistant
ai:
