      url: "https://www.youtube.com/@PeaceeduGreat"

# Site Footer
footer:
  links:
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook-square"
      url: "https://www.facebook.com/profile.php?id=100088693703792"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/GabrielPeace/Peaceedu"
    - label: "Youtube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@PeaceeduGreat"
