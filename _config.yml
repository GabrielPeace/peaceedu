  provider             : "coze"
  name                 : "Ewaya 家庭教育 AI 助手"
  bot_id               : "7383315514610843654"
  sdk_url              : "https://sf-cdn.coze.com/obj/unpkg-va/flow-platform/chat-app-sdk/0.1.0-beta.4/libs/oversea/index.js"

