# Reading Files
include:
  - .htaccess
  - _pages
  - /docs
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - "**/*.bak"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/main.min.js.map
  - assets/js/vendor
  - assets/scripts
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - peaceedu-jekyll-theme.gemspec
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - README.md
  - scripts
  - docs/engineering
  - tmp
  - category-tag.zip.bak
  - _config.yml.b
  # Minimal Mistakes example pages; keep the source files without publishing
  # them as part of the PeaceEdu site.
  - docs/_pages/archive-layout-with-content.md
  - docs/_pages/collection-archive.html
  - docs/_pages/edge-case.md
  - docs/_pages/foo-bar.md
  - docs/_pages/foo.md
  - docs/_pages/home.md
  - docs/_pages/markup.md
  - docs/_pages/page-archive.html
  - docs/_pages/pets.md
  - docs/_pages/portfolio-archive.md
  - docs/_pages/post-archive-feature-rows.html
  - docs/_pages/recipes-archive.md
  - docs/_pages/splash-page.md
  - docs/_pages/splash-page_md
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
timezone: # use the build environment timezone; content dates include explicit offsets

# Pagination with jekyll-paginate
paginate: 10 # amount of posts to show
paginate_path: /posts/page:num

# Pagination with jekyll-paginate-v2
# See https://github.com/sverrirs/jekyll-paginate-v2/blob/master/README-GENERATOR.md#site-configuration
#   for configuration details
pagination:
  # Set enabled to true to use paginate v2
  #  enabled: true
  debug: false
  collection: 'posts'
  per_page: 10
  permalink: '/page/:num/'
  title: ':title - page :num'
  limit: 0
  sort_field: 'date'
  sort_reverse: true
  category: 'posts'
  tag: ''
  locale: ''
  trail:
    before: 2
    after: 2

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-archives
  - jekyll-seo-tag

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-archives

# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path>/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path>/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid # liquid (default), or jekyll-archives
  path: /categories/
tag_archive:
  type: liquid # liquid (default)
  path: /tags/
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development

# Collections
collections:
    documents:
      output: false
      permalink: /:collection/:path/
    recipes:
      output: true
      permalink: /:collection/:path/
    most_popular:
      output: true
      permalink: /:collection/:path/

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      show_date: true
  # _pages
  #  - scope:
  #      path: "_pages"
  #      type: pages
  #    values:
  #      layout: single
  #      author_profile: true
  # _documents
  - scope:
      path: "_documents"
      type: documents
    values:
      layout: single
      read_time: false
      author_profile: false
      share: false
      comments: false
      sidebar:
        nav: "documents"
  # _recipes
  - scope:
      path: ""
      type: recipes
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
#  _most_popular
  - scope:
      path: "_most_popular"
      type: most_popular
    values:
      layout: single
      author_profile: false
      share: true
#  foo
  - scope:
      path: ""
      type: foo
    values:
      layout: list
      author_profile: false
      share: true
#  foo-bar
  - scope:
      path: ""
      type: foo-bar
    values:
      layout: list
      author_profile: false
      share: true
